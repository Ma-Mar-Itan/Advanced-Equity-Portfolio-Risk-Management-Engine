[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qfi-riskkit"
version = "0.1.0"
description = "Portfolio risk analytics with historical simulation, volatility scaling, backtesting, and stress testing."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "arch>=7.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=6.0",
    "pyarrow>=16",
    "requests>=2.31",
    "scipy>=1.13",
    "streamlit>=1.50",
    "yfinance>=1.0",
]

[project.optional-dependencies]
reports = [
    "kaleido>=1.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "selenium>=4.20",
    "statsmodels>=0.14",
]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["riskkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
